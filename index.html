<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مكتبة الهدوء والأجواء الماطرة 📖⛈️</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #050811;
      --card-bg: rgba(13, 18, 30, 0.95);
      --book-paper: #0b101d;
      --text-color: #e2e8f0;
      --accent-gold: #f59e0b;
      --border-color: rgba(245, 158, 11, 0.2);
      --font-size: 20px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      direction: rtl;
      position: relative;
      overflow-x: hidden;
    }

    .lightning-flash {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255, 255, 255, 0.25);
      pointer-events: none;
      z-index: 999;
      opacity: 0;
      transition: opacity 0.05s ease-out;
    }

    .app-container {
      background: var(--card-bg);
      backdrop-filter: blur(15px);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 30px;
      max-width: 850px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      position: relative;
      z-index: 10;
    }

    .control-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 25px;
      flex-wrap: wrap;
      gap: 15px;
    }

    .audio-controls {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .sound-unit {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.4);
      padding: 8px 12px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .volume-slider {
      width: 70px;
      accent-color: var(--accent-gold);
      cursor: pointer;
    }

    .btn-action {
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid var(--border-color);
      color: var(--accent-gold);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-action:hover, .btn-action.active {
      background: var(--accent-gold);
      color: #000;
    }

    .books-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .book-card {
      background: var(--book-paper);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 25px 20px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 10px;
    }

    .book-card:hover {
      transform: translateY(-5px);
      border-color: var(--accent-gold);
    }

    .book-emoji { font-size: 40px; }
    .book-title { font-size: 18px; font-weight: 700; color: var(--accent-gold); }

    .reader-view { display: none; }

    .book-frame {
      background: var(--book-paper);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 30px;
      margin: 20px 0;
      min-height: 380px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .book-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px dashed var(--border-color);
      padding-bottom: 12px;
      margin-bottom: 20px;
    }

    .book-content {
      font-family: 'Amiri', serif;
      font-size: var(--font-size);
      line-height: 2.2;
      text-align: justify;
    }

    .progress-bar {
      height: 4px;
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
      margin-bottom: 15px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent-gold);
      width: 0%;
      transition: width 0.3s;
    }

    .navigation-controls {
      display: flex;
      gap: 12px;
    }

    .btn-nav {
      background: rgba(245, 158, 11, 0.15);
      color: var(--accent-gold);
      border: 1px solid var(--accent-gold);
      padding: 12px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      flex: 1;
    }

    .btn-nav:disabled { opacity: 0.3; cursor: not-allowed; }

    .btn-return {
      background: transparent;
      color: var(--text-color);
      border: 1px solid var(--border-color);
      margin-top: 15px;
      width: 100%;
      padding: 10px;
      border-radius: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="lightning-flash" id="flash"></div>

  <div class="app-container">
    <div class="control-panel">
      <div class="audio-controls">
        <div class="sound-unit">
          <button class="btn-action" id="rainBtn" onclick="toggleRain()">🌧️ صوت المطر</button>
          <input type="range" class="volume-slider" id="rainVol" min="0" max="1" step="0.05" value="0.5" oninput="setRainVolume(this.value)">
        </div>

        <div class="sound-unit">
          <button class="btn-action" id="thunderBtn" onclick="playThunder()">⚡ صاعقة رعد</button>
        </div>
      </div>

      <div class="audio-controls">
        <button class="btn-action" onclick="adjustFont(1)">A+</button>
        <button class="btn-action" onclick="adjustFont(-1)">A-</button>
      </div>
    </div>

    <div id="booksView">
      <h2 style="color: var(--accent-gold); margin-bottom: 10px;">المكتبة الماطرة 📚</h2>
      <div class="books-grid" id="booksContainer"></div>
    </div>

    <div id="readerView" class="reader-view">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>

      <div class="book-frame">
        <div class="book-header">
          <span id="bookTitle" style="color: var(--accent-gold); font-weight: bold;"></span>
          <span id="pageIndicator" style="opacity: 0.7;"></span>
        </div>
        
        <div class="book-content" id="bookContent"></div>
      </div>

      <div class="navigation-controls">
        <button class="btn-nav" id="prevBtn" onclick="changePage(-1)">➔ الصفحة السابقة</button>
        <button class="btn-nav" id="nextBtn" onclick="changePage(1)">الصفحة التالية ⬅</button>
      </div>

      <button class="btn-return" onclick="showBooksGrid()">العودة للمكتبة 📖</button>
    </div>
  </div>

<script>
  const library = [
    {
      title: "قصة الأمير الصغير (كاملة)",
      emoji: "🦊",
      pages: [
        "طلب مني الأمير الصغير رسم خروف. ولما لم أكن قد رسمت في حياتي سوى ثعبان البوا من الخارج ومن الداخل، أعدت رسم إحدى اللوحتين اللتين كنت أتقنهما: ثعبان البوا المغلق. وصدمت عندما سمعت الفتى الصغير يقول: 'لا! لا! لا أريد فيلاً داخل ثعبان بوا! الثعبان خطير جداً، والفيل ضخم للغاية. بيتي صغير جداً، وأنا بحاجة إلى خروف'.",
        "عدت إلى الرسم من جديد، لكنه رفضه كسابقيه: 'هذا كبير السن، وأنا أريد خروفاً يعيش طويلاً'. ولما نفد صبري، خربشت رسم الصندوق، وقلت له: 'هذا هو الصندوق. والخروف الذي تطلبه موجود بالداخل'. وكم كانت مفاجأتي عظيمة عندما رأيت وجه قاضيي الصغير يضيء بابتهاج.",
        "وهكذا تعارفت على الأمير الصغير. علمت منه أنه ينتمي لكوكب صغير جداً لا يتعدى حجم البيت. وكان على كوكبه بذور ضارة هي بذور شجر 'الباوباب'، إذا لم يتم اقتلاعها فور ظهورها تنمو وتستفحل حتى تمزق الكوكب بأكمله بجذورها.",
        "في اليوم الرابع، علمت شغفه برؤية غروب الشمس. قال لي: 'تعلم أنني أحب غروب الشمس كثيراً، تعال بنا نذهب لنشاهد الغروب'. فقلت له: 'علينا أن ننتظر حتى تحين اللحظة'. فاستغرب في البداية ثم ضحك من نفسه، وقال: 'أنا دائماً أحسب أنني في دياري!'.",
        "وكانت هناك وردة فريدة على كوكبه، اعتنى بها كثيراً، لكنها كانت مغرورة ومتطلبة، مما جعل الأمير الصغير يقرر المغادرة واستكشاف الكواكب المجاورة بحثاً عن المعرفة وعن أصدقاء حقيقيين يدركون معنى الوفاء."
      ]
    },
    {
      title: "الشيخ والبحر (رحلة الصيد)",
      emoji: "⛵",
      pages: [
        "كان شيخاً يصطاد السمك بمفرده في قارب صغير بـ 'جلف ستريم'، ومضى عليه الآن أربعة وثمانون يوماً دون أن يظفر بسمكة واحدة. وفي الأربعين يوماً الأولى، كان يرافقه صبي، لكن والديه منعاه من الذهاب مع هذا الشيخ النحس.",
        "في اليوم الخامس والثمانين، قرر الشيخ سانتياغو أن يبحر بعيداً جداً عن الشاطئ، وتجاوز الحدود التي يجرؤ باقي الصيادين على الوصول إليها. ألقى بشباكه وطعمه في المياه العميقة وانتظر بالصبر الذي علمه إياه البحر.",
        "وفجأة، شعرت يداه بضغط شديد على الخيط. كانت سمكة 'مارلين' ضخمة جداً أكلت الطعم. لم يستطع سحبها، بل إن السمكة هي التي بدأت بسحب القارب الصغير خلفها نحو عرض المحيط.",
        "استمر الصراع يوماً وليلة كامليين، يدا الشيخ تنزفان وجسده مجهد، لكنه رفض الاستسلام. كان يخاطب السمكة باحترام قائلاً: 'أنا أحبك وأحترمك جداً، ولكنني سأقتلك قبل أن ينتهي هذا اليوم'.",
        "أخيراً، نجح الشيخ في ربط السمكة الضخمة بجانب القارب. لكن رحلة العودة كانت المأساة الحقيقية، حيث انجذبت أسماك القرش لرائحة الدم، وبدأ الشيخ يخوض معركة جديدة لل any عن صيده حتى وصل الشاطئ ولم يتبقَ من السمكة سوى هيكلها العظمي."
      ]
    }
  ];

  let currentBookIndex = 0;
  let currentPageIndex = 0;
  let currentFontSize = 20;

  // محاكي صوت المطر والرعد عبر Web Audio API (توليد حي بدون روابط)
  let audioCtx = null;
  let rainNode = null;
  let rainGain = null;
  let isRainPlaying = false;

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
  }

  function toggleRain() {
    initAudio();
    const btn = document.getElementById('rainBtn');

    if (!isRainPlaying) {
      // إنشاء ضوضاء وردية تشبه المطر تماماً
      const bufferSize = audioCtx.sampleRate * 2;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;

      for (let i = 0; i < bufferSize; i++) {
        let white = Math.random() * 2 - 1;
        b0 = 0.99886 * b0 + white * 0.0555179;
        b1 = 0.99332 * b1 + white * 0.0750759;
        b2 = 0.96900 * b2 + white * 0.1538520;
        b3 = 0.86650 * b3 + white * 0.3104856;
        b4 = 0.55000 * b4 + white * 0.5329522;
        b5 = -0.7616 * b5 - white * 0.0168980;
        data[i] = b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362;
        data[i] *= 0.11;
        b6 = white * 0.115926;
      }

      rainNode = audioCtx.createBufferSource();
      rainNode.buffer = buffer;
      rainNode.loop = true;

      rainGain = audioCtx.createGain();
      const vol = document.getElementById('rainVol').value;
      rainGain.gain.setValueAtTime(vol * 0.2, audioCtx.currentTime);

      rainNode.connect(rainGain);
      rainGain.connect(audioCtx.destination);
      rainNode.start();

      isRainPlaying = true;
      btn.classList.add('active');
    } else {
      rainNode.stop();
      isRainPlaying = false;
      btn.classList.remove('active');
    }
  }

  function setRainVolume(val) {
    if (rainGain && audioCtx) {
      rainGain.gain.setValueAtTime(val * 0.2, audioCtx.currentTime);
    }
  }

  function playThunder() {
    initAudio();
    // إضاءة فلاش البرق
    const flash = document.getElementById('flash');
    flash.style.opacity = '1';
    setTimeout(() => { flash.style.opacity = '0'; }, 80);
    setTimeout(() => { flash.style.opacity = '0.6'; }, 150);
    setTimeout(() => { flash.style.opacity = '0'; }, 250);

    // توليد صوت دوي الرعد البرمجي العميق
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(60, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 1.5);

    gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.8);

    osc.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start();
    osc.stop(audioCtx.currentTime + 1.8);
  }

  function renderBooks() {
    const container = document.getElementById('booksContainer');
    container.innerHTML = '';
    library.forEach((book, idx) => {
      const card = document.createElement('div');
      card.className = 'book-card';
      card.onclick = () => openBook(idx);
      card.innerHTML = `
        <div class="book-emoji">${book.emoji}</div>
        <div class="book-title">${book.title}</div>
        <div style="font-size:12px; opacity:0.6;">عدد الصفحات: ${book.pages.length}</div>
      `;
      container.appendChild(card);
    });
  }

  function openBook(idx) {
    currentBookIndex = idx;
    currentPageIndex = 0;
    document.getElementById('booksView').style.display = 'none';
    document.getElementById('readerView').style.display = 'block';
    updateReader();
  }

  function showBooksGrid() {
    document.getElementById('readerView').style.display = 'none';
    document.getElementById('booksView').style.display = 'block';
  }

  function updateReader() {
    const book = library[currentBookIndex];
    document.getElementById('bookTitle').innerText = `${book.emoji} ${book.title}`;
    document.getElementById('bookContent').innerText = book.pages[currentPageIndex];
    document.getElementById('pageIndicator').innerText = `الصفحة ${currentPageIndex + 1} من ${book.pages.length}`;

    const progress = ((currentPageIndex + 1) / book.pages.length) * 100;
    document.getElementById('progressFill').style.width = `${progress}%`;

    document.getElementById('prevBtn').disabled = (currentPageIndex === 0);
    document.getElementById('nextBtn').disabled = (currentPageIndex === book.pages.length - 1);
  }

  function changePage(dir) {
    currentPageIndex += dir;
    updateReader();
  }

  function adjustFont(val) {
    currentFontSize = Math.max(16, Math.min(28, currentFontSize + (val * 2)));
    document.documentElement.style.setProperty('--font-size', `${currentFontSize}px`);
  }

  window.onload = renderBooks;
</script>
</body>
</html>
