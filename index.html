<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>قصص قبل النوم 🌙</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #0b132b;
      --card-bg: rgba(28, 37, 65, 0.75);
      --text-color: #e0e1dd;
      --accent-color: #ffb703;
      --border-color: rgba(255, 255, 255, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }

    body {
      background-color: var(--bg-color);
      background-image: radial-gradient(circle at top, #1c2541 0%, #0b132b 100%);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      direction: rtl;
    }

    .container {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 30px 24px;
      max-width: 550px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    .moon-icon { font-size: 42px; margin-bottom: 8px; }
    h1 { font-size: 22px; color: var(--accent-color); margin-bottom: 6px; font-weight: 700; }
    .subtitle { font-size: 14px; opacity: 0.75; margin-bottom: 20px; }
    
    .story-card {
      background: rgba(11, 19, 43, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 18px;
      padding: 22px;
      margin: 20px 0;
      text-align: right;
      min-height: 200px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .story-title {
      font-size: 18px;
      color: var(--accent-color);
      margin-bottom: 12px;
      font-weight: 700;
      border-bottom: 1px dashed rgba(255, 183, 3, 0.3);
      padding-bottom: 8px;
    }

    .story-text {
      font-size: 15px;
      line-height: 1.8;
      color: #f1f5f9;
      white-space: pre-line;
    }

    .btn {
      background: var(--accent-color);
      color: #0b132b;
      border: none;
      padding: 14px 28px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 8px 20px rgba(255, 183, 3, 0.2);
      width: 100%;
    }

    .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(255, 183, 3, 0.3); }
    .btn:active { transform: translateY(1px); }
  </style>
</head>
<body>

  <div class="container">
    <div class="moon-icon">🌙</div>
    <h1>حكاية قبل النوم</h1>
    <p class="subtitle">جهزي نفسك للنوم واقرئي قصة الليلة الهادئة ✨</p>

    <div class="story-card">
      <div class="story-title" id="storyTitle">أهلاً بكِ في عالم الأحلام</div>
      <div class="story-text" id="storyText">اضغطي على الزر بالأسفل لاختيار قصة الليلة...</div>
    </div>

    <button class="btn" onclick="getRandomStory()">اقرئي قصة جديدة 📖</button>
  </div>

<script>
  const stories = [
    {
      title: "ليلى والذئب في الغابة الهادئة 🌲",
      text: "في طرف الغابة الخضراء، كانت ليلى تسير ببطء بين الأشجار العالية، تتابع الفراشات الملونة وتستمع لخرير الماء. وعندما التقت بالذئب، لم يكن شريرًا كما في الحكايات القديمة، بل كان حكيم الغابة الذي يرعى أزهارها. أهدى ليلى زهرة ياسمين ورائحة تفاح، وأرشدها إلى أسرع طريق لبيت جدتها لكي تتناول معها الفطيرة الدافئة وتنام في حضنها بأمان دون أي خوف."
    },
    {
      title: "سباق الأرنب والسلحفاة والهدوء 🐢",
      text: "في يوم صيفي دافئ، قرر الأرنب السريع والسلحفاة الهادئة القيام برحلة مشي بين المروج. كان الأرنب يركض متحمساً ثم يتعب، أما السلحفاة فكانت تمشي ببطء وثبات، تستمتع بكل خطوة وبأنفاس الهواء النقي. في نهاية المطاف، أدرك الأرنب أن السر ليس في السرعة والعجلة، بل في الهدوء والسلام الداخلي. استلقى الاثنان تحت ظلال شجرة كبيرة وناما على صوت نسيم الليل."
    },
    {
      title: "الأمير وأميرة الأحلام 👑",
      text: "كان هناك أمير يعيش في قصر بني على قمة جبل تحيط به الغيوم. كان يتمنى أن يجد شخصًا يفهم طيبة قلبه. وفي ليلة هادئة، رأى أميرة تجلس عند بحيرة الفضة تعزف لحنًا هادئاً يبعث السكينة. عندما اقترب منها، لم يتبادلا الكثير من الكلمات، بل اكتفيا بالنظر إلى النجوم المشعة. ومنذ تلك الليلة، أصبح كل منهما السند والأمان للآخر، يعيشان في سلام وحب لا ينتهي."
    },
    {
      title: "سندريلا وحذاء الزجاج 👠",
      text: "بعد يوم طويل من التعب، وقفت سندريلا في الشرفة تنظر إلى السماء وتتمنى أمئنية بسيطة: أن تجد الراحة والسلام. وفي الحفل الكبير، عندما التقت بالأمير، لم يبهره حذاؤها الزجاجي ولا فستانها اللامع، بل بهرته رقة قلبها وابتسامتها الصافية. وعندما دقت الساعة منتصف الليل، لم ينتهِ السحر، لأن الحب الحقيقي لا يختفي بزوال الزينة، وعاشا معاً في هدوء واستقرار."
    },
    {
      title: "الأمير الصغير ونجمة الليل 🌟",
      text: "سافر أمير صغير بين الكواكب بحثاً عن السر الذي يجعل الكائنات سعيدة. زار أشخاصاً كثيرين، لكنه لم يجد الإجابة إلا عندما التقى بنجمة صغيرة تضيء بنور خافت جداً. سألها: 'لماذا لا تضيئين بقوة؟'، فقالت: 'أنا أضيء فقط بالمقدار الذي يجعل من يراني يشعر بالهدوء وينام بسلام'. حينها فهم الأمير أن أجمل الأشياء في الحياة هي تلك التي تمنحنا السكينة دون ضجيج."
    },
    {
      title: "قلعة الغيوم والوردة السحرية 🌹",
      text: "في مملكة بعيدة فوق الغيوم، كانت هناك وردة سحرية لا تفتح أوراقها إلا عندما تستمع إلى حكاية حب صادقة. جاء أمير من بلاد المرج وأخذ يحكي للوردة عن أميرته وكيف يحميها ويحرص على سعادتها حتى في أصعب الأوقات. ومع كل كلمة حنونة، كانت أوراق الوردة تتفتح وتنشر عبقاً يتسبب في نوم عميق ومريح لكل من يشمه في القصر."
    }
  ];

  function getRandomStory() {
    const randomIndex = Math.floor(Math.random() * stories.length);
    const selected = stories[randomIndex];
    
    document.getElementById('storyTitle').innerText = selected.title;
    document.getElementById('storyText').innerText = selected.text;
  }
</script>

</body>
</html>
