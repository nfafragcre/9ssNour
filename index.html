<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مكتبة الهدوء والليالي الماطرة 📖🌙</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #050811;
      --card-bg: rgba(13, 18, 30, 0.95);
      --book-paper: #0b101d;
      --text-color: #e2e8f0;
      --accent-gold: #f59e0b;
      --accent-hover: #d97706;
      --border-color: rgba(245, 158, 11, 0.2);
      --font-size: 20px;
    }

    body.super-dark {
      --bg-color: #000000;
      --card-bg: #080808;
      --book-paper: #030303;
      --text-color: #a1a1aa;
      --accent-gold: #71717a;
      --border-color: #27272a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      direction: rtl;
      transition: background-color 0.4s ease;
      overflow-x: hidden;
      position: relative;
    }

    /* وميض البرق */
    .lightning-flash {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255, 255, 255, 0.12);
      pointer-events: none;
      z-index: 999;
      opacity: 0;
      transition: opacity 0.08s ease-out;
    }

    /* خلفية السماء والنجوم */
    .sky-container {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 0; overflow: hidden;
    }

    .falling-item {
      position: absolute; top: -30px;
      color: var(--accent-gold); opacity: 0.4;
      animation: fall linear infinite; user-select: none;
    }

    @keyframes fall {
      0% { transform: translateY(-30px) rotate(0deg); opacity: 0; }
      20% { opacity: 0.5; }
      80% { opacity: 0.5; }
      100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
    }

    .app-container {
      background: var(--card-bg);
      backdrop-filter: blur(15px);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 30px;
      max-width: 800px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      position: relative;
      z-index: 10;
    }

    /* شريط التحرر العلوي */
    .control-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 25px;
      flex-wrap: wrap;
      gap: 15px;
    }

    .audio-controls {
      display: flex;
      gap: 15px;
      align-items: center;
      flex-wrap: wrap;
    }

    .sound-unit {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.3);
      padding: 6px 12px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .volume-slider {
      width: 65px;
      accent-color: var(--accent-gold);
      cursor: pointer;
    }

    .btn-action {
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid var(--border-color);
      color: var(--accent-gold);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-action:hover, .btn-action.active {
      background: var(--accent-gold);
      color: #000;
    }

    select.btn-action {
      outline: none;
      background: var(--card-bg);
    }

    /* شبكة الكتب */
    .books-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .book-card {
      background: var(--book-paper);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 25px 20px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 12px;
      position: relative;
      overflow: hidden;
    }

    .book-card::before {
      content: '';
      position: absolute;
      right: 0; top: 0; bottom: 0;
      width: 6px;
      background: var(--accent-gold);
      opacity: 0.7;
    }

    .book-card:hover {
      transform: translateY(-6px);
      border-color: var(--accent-gold);
      box-shadow: 0 10px 25px rgba(245, 158, 11, 0.15);
    }

    .book-emoji { font-size: 48px; }
    .book-title { font-size: 17px; font-weight: 700; color: var(--accent-gold); }
    .book-author { font-size: 12px; opacity: 0.6; }

    /* قارئ الكتاب */
    .reader-view {
      display: none;
    }

    .book-frame {
      background: var(--book-paper);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 35px 30px;
      margin: 20px 0;
      min-height: 420px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
    }

    .book-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px dashed var(--border-color);
      padding-bottom: 12px;
      margin-bottom: 20px;
    }

    .book-header-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent-gold);
    }

    .book-content {
      font-family: 'Amiri', serif;
      font-size: var(--font-size);
      line-height: 2.2;
      color: var(--text-color);
      text-align: justify;
      text-align-last: right;
      margin-bottom: 20px;
      transition: font-size 0.2s ease;
    }

    .progress-bar-container {
      height: 4px;
      background: rgba(255,255,255,0.05);
      border-radius: 2px;
      margin-bottom: 12px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--accent-gold);
      width: 0%;
      transition: width 0.3s ease;
    }

    .reader-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      opacity: 0.7;
    }

    .navigation-controls {
      display: flex;
      gap: 12px;
      margin-top: 15px;
    }

    .btn-nav {
      background: rgba(245, 158, 11, 0.15);
      color: var(--accent-gold);
      border: 1px solid var(--accent-gold);
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      flex: 1;
    }

    .btn-nav:hover:not(:disabled) {
      background: var(--accent-gold);
      color: #000;
    }

    .btn-nav:disabled {
      opacity: 0.2;
      cursor: not-allowed;
      border-color: #444;
      color: #444;
    }

    .btn-return {
      background: transparent;
      color: var(--text-color);
      border: 1px solid var(--border-color);
      margin-top: 15px;
      width: 100%;
      padding: 10px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    .btn-return:hover {
      background: rgba(255,255,255,0.05);
    }
  </style>
</head>
<body>

  <div class="lightning-flash" id="flash"></div>
  <div class="sky-container" id="skyContainer"></div>

  <div class="app-container">
    
    <!-- شريط التحكم الصوتي والخيارات -->
    <div class="control-panel">
      <div class="audio-controls">
        <div class="sound-unit">
          <button class="btn-action" id="rainBtn" onclick="toggleRain()">🌧️ المطر</button>
          <input type="range" class="volume-slider" id="rainVol" min="0" max="1" step="0.05" value="0.4" oninput="updateVolume()">
        </div>

        <div class="sound-unit">
          <button class="btn-action" id="thunderBtn" onclick="toggleThunder()">⚡ البرق</button>
          <input type="range" class="volume-slider" id="thunderVol" min="0" max="1" step="0.05" value="0.5" oninput="updateVolume()">
        </div>
      </div>

      <div class="audio-controls">
        <select class="btn-action" id="timerSelect" onchange="setSleepTimer()">
          <option value="0">⏱️ المؤقت</option>
          <option value="15">15 دقيقة</option>
          <option value="30">30 دقيقة</option>
          <option value="60">60 دقيقة</option>
        </select>

        <button class="btn-action" onclick="toggleSuperDark()">🕶️ الوضع الداكن</button>
        <button class="btn-action" onclick="adjustFont(1)">A+</button>
        <button class="btn-action" onclick="adjustFont(-1)">A-</button>
      </div>
    </div>

    <!-- واجهة عرض شبكة الكتب -->
    <div id="booksView">
      <h2 style="color: var(--accent-gold); margin-bottom: 8px; font-weight: 700;">المكتبة الليلية 📚</h2>
      <p style="opacity: 0.6; font-size: 14px; margin-bottom: 20px;">اختر كتاباً من أمهات الروايات والأدب العالمي للقراءة الهادئة</p>
      <div class="books-grid" id="booksContainer"></div>
    </div>

    <!-- واجهة القراءة -->
    <div id="readerView" class="reader-view">
      <div class="progress-bar-container">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>

      <div class="book-frame">
        <div class="book-header">
          <span class="book-header-title" id="bookTitle">...</span>
          <button class="btn-action" onclick="copyCurrentPage()">📋 نسخ الصفحة</button>
        </div>
        
        <div class="book-content" id="bookContent">...</div>
        
        <div class="reader-footer">
          <span id="authorName">...</span>
          <span id="pageIndicator">الصفحة 0 من 0</span>
        </div>
      </div>

      <div class="navigation-controls">
        <button class="btn-nav" id="prevBtn" onclick="changePage(-1)">➔ الصفحة السابقة</button>
        <button class="btn-nav" id="nextBtn" onclick="changePage(1)">الصفحة التالية ⬅</button>
      </div>

      <button class="btn-return" onclick="showBooksGrid()">العودة لرفوف الكتب 📖</button>
    </div>

  </div>

<script>
  // المكتبة الأدبية الموسعة (نصوص كاملة ومطولة مقسمة لصفحات)
  const library = [
    {
      id: 1,
      title: "الأمير الصغير",
      author: "أنطوان دي سانت إكزوبيري",
      emoji: "🦊",
      pages: [
        "طلب مني الأمير الصغير رسم خروف. ولما لم أكن قد رسمت في حياتي سوى ثعبان البوا من الخارج ومن الداخل، أعدت رسم إحدى اللوحتين اللتين كنت أتقنهما: ثعبان البوا المغلق. وصدمت عندما سمعت الفتى الصغير يقول: 'لا! لا! لا أريد فيلاً داخل ثعبان بوا! الثعبان خطير جداً، والفيل ضخم للغاية. بيتي صغير جداً، وأنا بحاجة إلى خروف. ارسم لي خروفاً'. وهكذا قمت برسم الخروف. نظر إليه باهتمام ثم قال: 'لا، هذا مريض جداً. اصنع لي خروفاً آخر'. رسمت خروفاً جديداً، فابتسم صديقي الصغير برقة وتسامح قادماً للقول: 'أنت ترى بنفسك... هذا ليس خروفاً، إنه كبش له قرون...'.",

        "علمت مع الوقت أن كوكبه الأصلي هو الكويكب ب-612. هذا الكويكب لم يرَه بالمناظير سوى فلكي تركي عام 1909، ولم يصدقه أحد آنذاك بسبب زيه. لكن عندما أجبرهم حاكم مستبد على ارتداء الأزياء الأوربية، أعاد الفلكي تقديم إثباته عام 1920 برداء أنيق، فوافق الجميع على اكتشافه. إن الكبار يحبون الأرقام. عندما تحدثهم عن صديق جديد، لا يسألونك أبداً عن الأهم: لا يسألون عن نبرة صوته، أو ألعابه المفضلة، أو إن كان يجمع الفراشات، بل يسألون: كم عمره؟ كم أخاً له؟ كم وزنه؟ وكم يكسب أبوه؟ وحينها فقط يعتقدون أنهم عرفوه.",
        "قال لي الأمير الصغير في يومه الثالث: 'إن الباوباب ليست أشجاراً ضخمة، بل تبدأ صغيرة جداً قبل أن تكبر'. هذا صحيح، ولكن لماذا تريد لخروفك أن يأكل شجيرات الباوباب الصغيرة؟ أجابني وكأنه يوضح أمراً بديهياً: 'أوه، يلا العجب!'. وكان عليّ بذل جهد عقلي كبير لأفهم تلك المشكلة بمفردي. إن أرض كوكب الأمير الصغير تحتوي على بذور جيدة وبذور خبيثة. وبذور الباوباب تتغلغل في التربة، وإذا لم تقتلع شجيرة الباوباب فور تمييزها عن النبتة الصالحة، فإنها تتضخم وتثقب الكوكب بجذورها حتى ينفجر. إنها مسألة نظام وانضباط."

    },
    {
      id: 2,
      title: "النبي",
      author: "جبران خليل جبران",

      pages: [
        "المصطفى، المختار والحبيب، الذي كان فجراً لنهاره الخاص، كان قد انتظر اثنتي عشرة سنة في مدينة أورفاليس مجيء سفينته التي ترجعه إلى الجزيرة التي ولد فيها. وفي السنة الاثنتي عشرة، في اليوم الثاني عشر من أيلول، حصاد الشهر، صعد إلى التل خارج أسوار المدينة وتطلع نحو البحر؛ فرأى سفينته تقبل مع الضباب. حينئذ انفتحت أبواب قلبه، وطارت فرحته بعيداً فوق البحر. وأغمض عينيه وصلى في هدوء روحه. ولكنه وهو نازل من التل، اعتراه حزن، وقال في قلبه: كيف أرحل في سلام ودون ألم؟ لا، لن أخرج من هذه المدينة دون أن تجرح روحي.",

    {

    {
      id: 4,
      title: "رسائل إلى شاعر شاب",
      author: "راينر ماريا ريلكه",
      emoji: "✉️",
      pages: [
        "تسألني إن كانت قصائدك جيدة. تسألني أنا، وقد سألت قبلي آخرين. ترسلها إلى المجلاّت، وتقارنها بقصائد أخرى، وتضطرب حين ترفض هيئات التحرير محاولاتك. الآن، وبما أنك سمحت لي بنصحك، أرجوك أن تتكف عن كل ذلك. إنك تنظر إلى الخارج، وهذا أكثر ما ينبغي عليك تجنبه الآن. لا أحد يستطيع أن ينصحك أو يساعدك، لا أحد. هناك طريق واحد فقط: ادخل في أعماق نفسك. ابحث عن السبب الذي يدعوك إلى الكتابة؛ افحص ما إذا كانت جذوره تمتد في أعمق أركان قلبك، واعترف لنفسك بما إذا كنت ستضطر إلى الموت إذا حُظر عليك الكتابة.",
        "إذا كانت الإجابة بـ 'نعم' حازمة وصريحة، وإذا كان بإمكانك أن تواجه هذا السؤال الشديد بـ 'يجب عليّ' بسيطة وجليلة، فابنِ حياتك وفقاً لهذا الضرورة. إن حياتك، حتى في أكثر لحظاتها قلقاً وضآلة، يجب أن تصبح علامة وشاهداً على هذا الدافع. ثم اقترب من الطبيعة، وحاول أن تقول، كما لو كنت أول إنسان على وجه الأرض، ما تراه وما تعيشه وما تحبه وما تفقده. لا تكتب قصائد حب، تجنب في البداية الأشكال الشائعة والمبتذلة؛ فهي الأصعب، إذ تتطلب قوة ناضجة وعظيمة لتقديم شيء خاص بك في مجال توجد فيه تقاليد ممتازة بكثرة.",
        "عش الأسئلة الآن. ربما تتدرج تدريجياً، دون أن تلاحظ، في يوم بعيد، لتعيش في قلب الإجابة. إن العزلة يا صديقي شيء عظيم، ولكنها ليست سهلة. إنها صعبة، ولكن كون الشيء صعباً يجب أن يكون سبباً إضافياً لنا لفعله. أن تحب هو أيضاً شيء جيد، فالأمر متطلب. إن الحب من إنسان لإنسان هو ربما أصعب ما كُلفنا به، إنه الاختبار الأقصى، والعمل الذي تتهيأ له كل الأعمال الأخرى."
      ]
    }
  ];

  let currentBookIndex = 0;
  let currentPageIndex = 0;
  let currentFontSize = 20;

  let audioCtx = null;
  let isRainActive = false;
  let isThunderActive = false;
  let rainSource = null;
  let rainGainNode = null;
  let thunderInterval = null;
  let sleepTimerTimeout = null;

  function init() {
    renderBooksGrid();
    createFallingSky();
  }

  function renderBooksGrid() {
    const container = document.getElementById('booksContainer');
    container.innerHTML = '';
    library.forEach((book, idx) => {
      const card = document.createElement('div');
      card.className = 'book-card';
      card.onclick = () => openBook(idx);
      card.innerHTML = `
        <div class="book-emoji">${book.emoji}</div>
        <div class="book-title">${book.title}</div>
        <div class="book-author">${book.author}</div>
      `;
      container.appendChild(card);
    });
  }

  function openBook(index) {
    currentBookIndex = index;
    currentPageIndex = 0;
    document.getElementById('booksView').style.display = 'none';
    document.getElementById('readerView').style.display = 'block';
    updateReaderUI();
  }

  function showBooksGrid() {
    document.getElementById('readerView').style.display = 'none';
    document.getElementById('booksView').style.display = 'block';
  }

  function updateReaderUI() {
    const book = library[currentBookIndex];
    document.getElementById('bookTitle').innerText = `${book.emoji} ${book.title}`;
    document.getElementById('authorName').innerText = `الكاتب: ${book.author}`;
    document.getElementById('bookContent').innerText = book.pages[currentPageIndex];
    document.getElementById('pageIndicator').innerText = `الصفحة ${currentPageIndex + 1} من ${book.pages.length}`;

    const progress = ((currentPageIndex + 1) / book.pages.length) * 100;
    document.getElementById('progressFill').style.width = `${progress}%`;

    document.getElementById('prevBtn').disabled = (currentPageIndex === 0);
    document.getElementById('nextBtn').disabled = (currentPageIndex === book.pages.length - 1);
  }

  function changePage(direction) {
    currentPageIndex += direction;
    updateReaderUI();
  }

  function createFallingSky() {
    const sky = document.getElementById('skyContainer');
    const symbols = ['🌙', '⭐', '✨', '💫'];
    for (let i = 0; i < 20; i++) {
      const item = document.createElement('div');
      item.className = 'falling-item';
      item.innerText = symbols[Math.floor(Math.random() * symbols.length)];
      item.style.left = `${Math.random() * 100}%`;
      item.style.fontSize = `${Math.random() * 10 + 12}px`;
      item.style.animationDuration = `${Math.random() * 10 + 8}s`;
      item.style.animationDelay = `${Math.random() * 5}s`;
      sky.appendChild(item);
    }
  }

  /* AudioContext ومحاكاة الصوت */
  function initAudioContext() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function toggleRain() {
    initAudioContext();
    const btn = document.getElementById('rainBtn');

    if (!isRainActive) {
      const bufferSize = audioCtx.sampleRate * 2;
      const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const output = noiseBuffer.getChannelData(0);

      for (let i = 0; i < bufferSize; i++) {
        output[i] = Math.random() * 2 - 1;
      }

      rainSource = audioCtx.createBufferSource();
      rainSource.buffer = noiseBuffer;
      rainSource.loop = true;

      const lowpass = audioCtx.createBiquadFilter();
      lowpass.type = 'lowpass';
      lowpass.frequency.setValueAtTime(420, audioCtx.currentTime);

      rainGainNode = audioCtx.createGain();
      const vol = document.getElementById('rainVol').value;
      rainGainNode.gain.setValueAtTime(vol * 0.08, audioCtx.currentTime);

      rainSource.connect(lowpass);
      lowpass.connect(rainGainNode);
      rainGainNode.connect(audioCtx.destination);

      rainSource.start();
      isRainActive = true;
      btn.classList.add('active');
    } else {
      if (rainSource) rainSource.stop();
      isRainActive = false;
      btn.classList.remove('active');
    }
  }

  function toggleThunder() {
    initAudioContext();
    const btn = document.getElementById('thunderBtn');
    
    if (!isThunderActive) {
      isThunderActive = true;
      btn.classList.add('active');

      playSoftThunder();
      thunderInterval = setInterval(playSoftThunder, 10000);
    } else {
      isThunderActive = false;
      if (thunderInterval) clearInterval(thunderInterval);
      btn.classList.remove('active');
    }
  }

  function updateVolume() {
    if (rainGainNode && isRainActive) {
      const vol = document.getElementById('rainVol').value;
      rainGainNode.gain.setValueAtTime(vol * 0.08, audioCtx.currentTime);
    }
  }

  function triggerLightningFlash() {
    const flash = document.getElementById('flash');
    flash.style.opacity = '1';
    setTimeout(() => { flash.style.opacity = '0'; }, 100);
  }

  function playSoftThunder() {
    if (!audioCtx || !isThunderActive) return;

    triggerLightningFlash();

    const now = audioCtx.currentTime;
    const masterVol = document.getElementById('thunderVol').value;

    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const filter = audioCtx.createBiquadFilter();

    osc.type = 'sine';
    osc.frequency.setValueAtTime(90, now);
    osc.frequency.exponentialRampToValueAtTime(25, now + 2.2);

    filter.type = 'lowpass';
    filter.frequency.value = 200;

    gain.gain.setValueAtTime(0.01, now);
    gain.gain.linearRampToValueAtTime(0.3 * masterVol, now + 0.1);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 2.2);

    osc.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);

    osc.start(now);
    osc.stop(now + 2.2);
  }

  function setSleepTimer() {
    if (sleepTimerTimeout) clearTimeout(sleepTimerTimeout);
    const minutes = parseInt(document.getElementById('timerSelect').value);
    
    if (minutes > 0) {
      sleepTimerTimeout = setTimeout(() => {
        if (isRainActive) toggleRain();
        if (isThunderActive) toggleThunder();
        document.getElementById('timerSelect').value = "0";
      }, minutes * 60 * 1000);
    }
  }

  function copyCurrentPage() {
    const text = document.getElementById('bookContent').innerText;
    navigator.clipboard.writeText(text).then(() => {
      alert("تم نسخ الصفحة الحالية لنحافظة جهازك.");
    });
  }

  function adjustFont(val) {
    currentFontSize = Math.max(16, Math.min(28, currentFontSize + (val * 2)));
    document.documentElement.style.setProperty('--font-size', `${currentFontSize}px`);
  }

  function toggleSuperDark() {
    document.body.classList.toggle('super-dark');
  }

  window.onload = init;
</script>

</body>
</html>
