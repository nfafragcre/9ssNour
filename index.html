<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>قصص الأقمار والنجوم 🌙</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #050814;
      --card-bg: rgba(15, 23, 42, 0.85);
      --text-glow: #fff8db;
      --accent-gold: #ffc107;
      --border-color: rgba(255, 193, 7, 0.2);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }

    body {
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(2px 2px at 20px 30px, #fff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 40px 70px, #ffd700, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 90px 40px, #fff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 160px 120px, #ffd700, rgba(0,0,0,0));
      background-repeat: repeat;
      background-size: 200px 200px;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 15px;
      direction: rtl;
    }

    .container {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 28px 20px;
      max-width: 600px;
      width: 100%;
      text-align: center;
      box-shadow: 0 0 30px rgba(255, 193, 7, 0.1);
    }

    .stars-header { font-size: 24px; letter-spacing: 4px; margin-bottom: 5px; color: var(--accent-gold); }
    
    .story-card {
      background: rgba(5, 8, 20, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 25px 20px;
      margin: 20px 0;
      min-height: 280px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .story-title {
      font-size: 20px;
      color: var(--accent-gold);
      font-weight: 700;
      border-bottom: 1px dashed var(--border-color);
      padding-bottom: 10px;
      margin-bottom: 15px;
    }

    .story-text {
      font-family: 'Amiri', serif;
      font-size: 22px; /* خط كبير ومريح للقصص */
      line-height: 1.9;
      color: var(--text-glow);
      text-shadow: 0 0 8px rgba(255, 248, 219, 0.4); /* تأثير الخط المضيء */
      text-align: justify;
      text-align-last: center;
      margin-bottom: 15px;
    }

    .page-indicator {
      font-size: 13px;
      color: var(--accent-gold);
      opacity: 0.8;
    }

    .controls {
      display: flex;
      gap: 10px;
      justify-content: space-between;
      margin-top: 10px;
    }

    .btn {
      background: rgba(255, 193, 7, 0.15);
      color: var(--accent-gold);
      border: 1px solid var(--accent-gold);
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      flex: 1;
    }

    .btn:hover:not(:disabled) {
      background: var(--accent-gold);
      color: #050814;
      box-shadow: 0 0 15px rgba(255, 193, 7, 0.4);
    }

    .btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      border-color: #666;
      color: #666;
    }

    .btn-main {
      background: var(--accent-gold);
      color: #050814;
      width: 100%;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="stars-header">✨ 🌙 ✨</div>
    <h1 style="font-size: 20px; color: #fff;">حكايات ننوزة للنوم</h1>

    <div class="story-card">
      <div class="story-title" id="storyTitle">اضغطي للبدء</div>
      <div class="story-text" id="storyText">اختر قصة وابدأ القراءة عبر الصفحات...</div>
      <div class="page-indicator" id="pageIndicator">الصفحة 0 من 0</div>
    </div>

    <div class="controls">
      <button class="btn" id="prevBtn" onclick="changePage(-1)" disabled>السابقة ➔</button>
      <button class="btn" id="nextBtn" onclick="changePage(1)" disabled>⬅ التالية</button>
    </div>

    <button class="btn btn-main" onclick="loadRandomStory()">اختيار قصة جديدة 📖</button>
  </div>

<script>
  // قائمة القصص المكتوبة كاملاً ومقسمة على عدة صفحات
  const stories = [
    {
      title: "ليلى والذئب وحارس الغابة 🌲",
      pages: [
        "في أطراف قرية هادئة تحفها الأشجار العالية، كانت تنام ليلى في بيتها الخشبي الصغير. وفي أحد الأيام، طلبت منها أمها أن تأخذ سلة مملوءة بالكعك الدافئ والزبادي إلى بيت جدتها التي تسكن خلف التلة المورقة.",
        "ارتدت ليلى رداءها الأحمر الأثير، وأخذت السلة وسارت بخطى متأنية. كانت الغابة مليئة بأصوات العصافير وخرير المياه، ولم تكن مظلمة بل كانت أشعة الشمس تتسلل بين الأغصان لتصنع لوحة من الضوء والظلال.",
        "وفي منتصف الطريق، خرج من بين الأشجار ذئب رمادي ضخم. لم يرتجف قلب ليلى، لأن هذا الذئب لم يكن سوى حارس الغابة القديم. اقترب منها ببطء وقدم لها زهرة ياسمين برية رائحتها تعطر الهواء.",
        "قال لها الذئب بصوت هادئ عميق: 'يا ليلى، الطريق المختصر عبر الجدول أمن وأجمل لجدتكِ في هذا الوقت'. شكرم ليلى الذئب وتابعت طريقها وهي تستمتع بالنسمات العليلة، حتى وصلت بيت جدتها وقضيا معاً ليلة دافئة مليئة بالحكايات."
      ]
    },
    {
      title: "سباق الأرنب والسلحفاة الحقيقي 🐢",
      pages: [
        "كان الأرنب 'سريع' يفخر دائماً بخفته وسرعته القاطعة، بينما كانت السلحفاة 'حكيمة' تسير ببطء شديد وتأمل كل زهرة وحصاة في طريقها. وفي يوم من أيام الربيع، اتفقا على إجراء مسابقة مشي نحو الشجرة الكبيرة.",
        "انطلق الأرنب كالسهم وترك السلحفاة خلفه بمسافة طويلة. ولكن بدلاً من أن يركض دون توقف، شعر بالملل من العجلة، فقرر الاستلقاء تحت ظلال شجرة توت دافئة وقال في نفسه: 'لدي وقت طويل لأستريح'.",
        "أما السلحفاة، فواصلت السير بخطواتها المنتظمة. لم تكن تفكر في الفوز بقدر ما كانت تستمتع بنسيم الرياح ورائحة الأعشاب الخضراء. كانت كل خطوة بالنسبة لها لحظة من السلام والهدوء.",
        "عندما وصل الأرنب متأخراً بعد أن أخذ قيلولة طويلة، وجد السلحفاة تجلس عند الشجرة الكبيرة وابتسمت له قائلة: 'السر ليس في أن تصل أولاً يا صديقي، بل في أن تستمتع بالطريق دون إرهاق قلبك'."
      ]
    },
    {
      title: "قصر الأميرة ووردة النجوم 👑",
      pages: [
        "في مملكة شاسعة تقع فوق جبال الضباب، عاش أمير يملك كل شيء لكنه كان يبحث عن السكينة. سمع عن أميرة تعيش في قصر من الفضة، تحرس وردة فريدة لا تتفتح إلا عندما تعزف لها ألحاناً هادئة.",
        "سافر الأمير أياماً طويلة عبر الوديان حتى وصل إلى القصر. هناك وجد الأميرة تجلس في شرفة القصر تحت سماء مليئة بالنجوم المضيئة، وتضع يدها على الوردة وتغني بصوت عذب يبعث الطمأنينة.",
        "اقترب الأمير ببطء ولم ينطق بكلمة، بل أخرج ناي خشبياً صغيراً وبدأ يرافق عزفها بنغمات هادئة تشبه صوت المطر خفيف السقوط. وفي تلك اللحظة، بدأت أوراق الوردة تتفتح وتنشر ضياءً ذهبياً دافئاً حولهما.",
        "منذ تلك الليلة، أدرك الأمير والأميرة أن الطمأنينة الحقيقية لا تأتي من الثراء أو القلاع، بل من وجود شخص يشاركك الهدوء والصمت قبل أن تشارك الكلام."
      ]
    }
  ];

  let currentStory = null;
  let currentPageIndex = 0;

  function loadRandomStory() {
    const randomIndex = Math.floor(Math.random() * stories.length);
    currentStory = stories[randomIndex];
    currentPageIndex = 0;
    updateUI();
  }

  function changePage(direction) {
    if (!currentStory) return;
    currentPageIndex += direction;
    updateUI();
  }

  function updateUI() {
    document.getElementById('storyTitle').innerText = currentStory.title;
    document.getElementById('storyText').innerText = currentStory.pages[currentPageIndex];
    document.getElementById('pageIndicator').innerText = `الصفحة ${currentPageIndex + 1} من ${currentStory.pages.length}`;

    // إعدادات الأزرار
    document.getElementById('prevBtn').disabled = (currentPageIndex === 0);
    document.getElementById('nextBtn').disabled = (currentPageIndex === currentStory.pages.length - 1);
  }

  // تحميل القصة الأولى تلقائياً عند فتح الصفحة
  window.onload = loadRandomStory;
</script>

</body>
</html>
