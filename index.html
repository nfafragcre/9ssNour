<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مكتبة أحلام المساء 🌙</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #030712;
      --card-bg: rgba(17, 24, 39, 0.85);
      --text-glow: #fef08a;
      --accent-gold: #fbbf24;
      --border-color: rgba(251, 191, 36, 0.25);
      --font-size: 22px;
    }

    body.super-dark {
      --bg-color: #000000;
      --card-bg: #050505;
      --border-color: #222;
      --text-glow: #d4d4d8;
      --accent-gold: #a1a1aa;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }

    body {
      background-color: var(--bg-color);
      color: #f3f4f6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 15px;
      direction: rtl;
      transition: background-color 0.4s ease;
      overflow-x: hidden;
      position: relative;
    }

    /* وميض البرق */
    .lightning-flash {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255, 255, 255, 0.15);
      pointer-events: none;
      z-index: 99;
      opacity: 0;
      transition: opacity 0.05s ease-out;
    }

    .sky-container {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 0; overflow: hidden;
    }

    .falling-item {
      position: absolute; top: -30px;
      color: var(--accent-gold); opacity: 0.7;
      animation: fall linear infinite; user-select: none;
    }

    @keyframes fall {
      0% { transform: translateY(-30px) rotate(0deg); opacity: 0; }
      20% { opacity: 0.8; }
      80% { opacity: 0.8; }
      100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
    }

    .container {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      border-radius: 28px;
      padding: 25px 20px;
      max-width: 650px;
      width: 100%;
      text-align: center;
      box-shadow: 0 0 35px rgba(0,0,0,0.9);
      position: relative;
      z-index: 10;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .sound-control {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .volume-slider {
      width: 80px;
      accent-color: var(--accent-gold);
      cursor: pointer;
    }

    .icon-btn {
      background: rgba(251, 191, 36, 0.1);
      border: 1px solid var(--border-color);
      color: var(--accent-gold);
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .icon-btn:hover, .icon-btn.active { background: var(--accent-gold); color: #000; }

    /* قائمة الكتب */
    .books-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
      margin: 20px 0;
    }

    .book-card {
      background: rgba(3, 7, 18, 0.6);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 20px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .book-card:hover {
      transform: translateY(-5px);
      border-color: var(--accent-gold);
      box-shadow: 0 5px 20px rgba(251, 191, 36, 0.2);
    }

    .book-emoji { font-size: 40px; }
    .book-title { font-size: 16px; font-weight: 700; color: var(--accent-gold); }

    /* كارت القصة */
    .story-card {
      background: rgba(3, 7, 18, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      padding: 22px 18px;
      margin: 15px 0;
      min-height: 300px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .story-title {
      font-size: 20px;
      color: var(--accent-gold);
      font-weight: 700;
      border-bottom: 1px dashed var(--border-color);
      padding-bottom: 10px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .story-text {
      font-family: 'Amiri', serif;
      font-size: var(--font-size);
      line-height: 2;
      color: var(--text-glow);
      text-shadow: 0 0 8px rgba(254, 240, 138, 0.25);
      text-align: justify;
      text-align-last: center;
      margin-bottom: 15px;
      transition: font-size 0.2s;
    }

    .progress-bar {
      height: 4px; background: rgba(255,255,255,0.1);
      border-radius: 2px; margin-bottom: 10px; overflow: hidden;
    }

    .progress-fill {
      height: 100%; background: var(--accent-gold);
      width: 0%; transition: width 0.3s ease;
    }

    .page-indicator { font-size: 13px; color: var(--accent-gold); opacity: 0.8; }
    .controls { display: flex; gap: 10px; justify-content: space-between; margin-top: 10px; }

    .btn {
      background: rgba(251, 191, 36, 0.12);
      color: var(--accent-gold);
      border: 1px solid var(--accent-gold);
      padding: 12px 18px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      flex: 1;
    }

    .btn:hover:not(:disabled) { background: var(--accent-gold); color: #000; }
    .btn:disabled { opacity: 0.2; cursor: not-allowed; border-color: #555; color: #555; }
    .btn-main { background: var(--accent-gold); color: #000; width: 100%; margin-top: 10px; }

    select.icon-btn {
      outline: none;
      background: #111827;
    }
  </style>
</head>
<body>

  <div class="lightning-flash" id="flash"></div>
  <div class="sky-container" id="skyContainer"></div>

  <div class="container">
    <div class="top-bar">
      <div class="sound-control">
        <button class="icon-btn" id="rainBtn" onclick="toggleRain()">🌧️ مطر: مغلق</button>
        <input type="range" class="volume-slider" id="rainVol" min="0" max="1" step="0.05" value="0.4" oninput="updateVolume()">
      </div>

      <div class="sound-control">
        <button class="icon-btn" id="thunderBtn" onclick="toggleThunder()">⚡ برق: مغلق</button>
        <input type="range" class="volume-slider" id="thunderVol" min="0" max="1" step="0.05" value="0.5" oninput="updateVolume()">
      </div>

      <select class="icon-btn" id="timerSelect" onchange="setSleepTimer()">
        <option value="0">⏱️ المؤقت: إيقاف</option>
        <option value="15">⏱️ 15 دقيقة</option>
        <option value="30">⏱️ 30 دقيقة</option>
        <option value="60">⏱️ 60 دقيقة</option>
      </select>

      <button class="icon-btn" onclick="toggleSuperDark()">🕶️ ظلام</button>
      <div>
        <button class="icon-btn" onclick="adjustFont(1)">A+</button>
        <button class="icon-btn" onclick="adjustFont(-1)">A-</button>
      </div>
    </div>

    <!-- واجهة القائمة الخاصة بالكتب -->
    <div id="booksView">
      <h2 style="color: var(--accent-gold); margin-bottom: 10px;">اختر كتاباً ليلياً 📖</h2>
      <div class="books-grid" id="booksContainer"></div>
    </div>

    <!-- واجهة قراءة القصة -->
    <div id="storyView" style="display: none;">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

      <div class="story-card">
        <div class="story-title">
          <span id="storyTitle">...</span>
          <button class="icon-btn" onclick="copyStoryText()">📋 نسخ</button>
        </div>
        <div class="story-text" id="storyText">...</div>
        <div class="page-indicator" id="pageIndicator">الصفحة 0 من 0</div>
      </div>

      <div class="controls">
        <button class="btn" id="prevBtn" onclick="changePage(-1)" disabled>السابقة ➔</button>
        <button class="btn" id="nextBtn" onclick="changePage(1)" disabled>⬅ التالية</button>
      </div>

      <button class="btn btn-main" onclick="showBooksList()">العودة لقائمة الكتب 📚</button>
    </div>
  </div>

<script>
  const stories = [
    {
      id: 1,
      title: "ليلى والذئب وحارس الغابة",
      emoji: "🌲",
      pages: [
        "في أطراف قرية هادئة تحفها الأشجار العالية، كانت تنام ليلى في بيتها الخشبي الصغير. وفي أحد الأيام، طلبت منها أمها أن تأخذ سلة مملوءة بالكعك الدافئ إلى بيت جدتها التي تسكن خلف التلة المورقة.",
        "ارتدت ليلى رداءها الأحمر الأثير، وأخذت السلة وسارت بخطى متأنية. كانت الغابة مليئة بأصوات العصافير وخرير المياه، وكانت أشعة الشمس تتسلل بين الأغصان لتصنع لوحة من الضوء والظلال.",
        "وفي منتصف الطريق، خرج من بين الأشجار ذئب رمادي ضخم. لم تبتعد ليلى، لأن هذا الذئب لم يكن سوى حارس الغابة القديم. اقترب منها ببطء وقدم لها زهرة ياسمين برية رائحتها تعطر الهواء.",
        "قال لها الذئب بصوت هادئ عميق: 'يا ليلى، الطريق المختصر عبر الجدول أمن وأجمل لجدتكِ'. شكرته ليلى وتابعت طريقها وهي تستمتع بالنسمات العليلة، حتى وصلت بيت جدتها وقضيا معاً ليلة دافئة."
      ]
    },
    {
      id: 2,
      title: "سباق الأرنب والسلحفاة الحقيقي",
      emoji: "🐢",
      pages: [
        "كان الأرنب 'سريع' يفخر دائماً بخفته، بينما كانت السلحفاة 'حكيمة' تسير ببطء شديد وتتأمل كل زهرة وحصاة. وفي يوم من أيام الربيع، اتفقا على إجراء مسابقة مشي نحو الشجرة الكبيرة.",
        "انطلق الأرنب كالسهم وترك السلحفاة خلفه. ولكن بدلاً من أن يركض دون توقف، شعر بالملل من العجلة، فقرر الاستلقاء تحت ظلال شجرة توت دافئة وقال في نفسه: 'لدي وقت طويل لأستريح'.",
        "أما السلحفاة، فواصلت السير بخطواتها المنتظمة. لم تكن تفكر في الفوز بقدر ما كانت تستمتع بنسيم الرياح ورائحة الأعشاب الخضراء. كانت كل خطوة بالنسبة لها لحظة من السلام والهدوء.",
        "عندما وصل الأرنب متأخراً بعد أن أخذ قيلولة طويلة، وجد السلحفاة تجلس عند الشجرة الكبيرة وابتسمت له قائلة: 'السر ليس في أن تصل أولاً يا صديقي، بل في أن تستمتع بالطريق دون إرهاق قلبك'."
      ]
    },
    {
      id: 3,
      title: "قصر الأميرة ووردة النجوم",
      emoji: "👑",
      pages: [
        "في مملكة شاسعة تقع فوق جبال الضباب، عاش أمير يبحث عن السكينة. سمع عن أميرة تعيش في قصر من الفضة، تحرس وردة فريدة لا تتفتح إلا عندما تستمع لألحان هادئة.",
        "سافر الأمير أياماً طويلة عبر الوديان حتى وصل إلى القصر. هناك وجد الأميرة تجلس في الشرفة تحت سماء مليئة بالنجوم المضيئة، وتضع يدها على الوردة وتغني بصوت عذب يبعث الطمأنينة.",
        "اقترب الأمير ببطء، وأخرج ناي خشبياً صغيراً وبدأ يرافق عزفها بنغمات هادئة تشبه صوت المطر خفيف السقوط. وفي تلك اللحظة، بدأت أوراق الوردة تتفتح وتنشر ضياءً ذهبياً دافئاً حولهما.",
        "منذ تلك الليلة، أدرك الأمير والأميرة أن الطمأنينة الحقيقية لا تأتي من القلاع العالية، بل من وجود شخص يشاركك الهدوء والصمت قبل أن تشارك الكلام."
      ]
    },
    {
      id: 4,
      title: "الأمير والوردة البيضاء",
      emoji: "🤍",
      pages: [
        "في مملكة بعيدة، كان هناك أمير يقضي لياليه في العناية بحديقة قصر قُديمة. وكانت هناك وردة بيضاء واحدة لا تفتح أوراقها إلا مع ظهور أول نجمة في السماء.",
        "كان الأمير يجلس جوارها كل مساء، يحكي لها عن تفاصيل يومه وعن حلمه بلقاء شخص يشاركه حب الهدوء والأشياء البسيطة. وكانت الوردة تتمايل مع كلماته كأنها تفهمه.",
        "وفي ليلة اكتمال القمر، مرت بالحديقة فتاة غريبة عن القرية، تبحث عن ملجأ هادئ. عندما سمعت كلمات الأمير للوردة، ابتسمت وقالت له: 'الأشياء الجميلة لا تحتاج إلى ضجيج لتُلاحظ'.",
        "ومنذ ذلك اليوم، لم يعد الأمير يتحدث للوردة بمفرده، بل أصبحا يجلسان معاً تحت ضوء القمر، يستمتعان بالهدوء الذي جمع بين قلبيهما."
      ]
    },
    {
      id: 5,
      title: "بائع الفوانيس والقمر",
      emoji: "🏮",
      pages: [
        "في بلدة صغيرة على ضفاف البحيرة، عاش عجوز يصنع فوانيس خشبية دافئة الضوء. لم يكن يبيعها بالمال، بل كان يهديلها لمن يحتاج نوراً يطمئن قلبه قبل النوم.",
        "في إحدى الليالي المظلمة، جاءته طفلة صغيرة تخاف من ظلال الليل. أخذ العجوز فانوساً صغيراً ووضع فيه شمعة برائحة اللافندر الدافئة وقال لها: 'هذا الفانوس يحمل جزءاً من ضوء القمر'.",
        "عندما أخذت الفتاة الفانوس إلى غرفتها، لم تنبعث منه إضاءة قوية تزعج عينيكِ، بل ضوء خافت وناعم يتراقص على الجدران برقة. وفي لحظات قليلة، شعرت بالدفء وأغمضت عينيها لتنام بسلام.",
        "عادت البلدة كلها تعرف أن فوانيس العجوز ليست مجرد إضاءة، بل هي تعويذة هدوء وتذكير بأن الظلام دائماً يزول مع أول شعاع أمل."
      ]
    },
    {
      id: 6,
      title: "أميرة المرج الوردي",
      emoji: "🌸",
      pages: [
        "ورا جبال الضباب، كان هناك مرج واسع تتفتح فيه أزهار وردية لا تذبل أبداً. وكانت تعيش هناك أميرة تحب السير حافية القدمين على الأعشاب الندية كل مساء.",
        "كانت تعزف على قيثارة صغيرة ألحاناً تشبه صوت النسمات الصيفية. وكانت الحيوانات الصغيرة تجمع حولها لتستمع إلى عزفها وتستعد للنوم.",
        "وفي إحدى الليالي، جاء أمير مسافر تعب من رحلته الطويلة. عندما سمع عزفها، استلقى على الأعشاب الخضراء ووجد لأول مرة منذ سنوات الراحة التي كان يبحث عنها.",
        "قال لها قبل أن يغفو: 'مملكتكِ ليست فيها قلاع أو حراس، لكنها أجمل مكان رأيته'. ابتسمت الأميرة وواصلت العزف حتى غطت النجوم السماء كلها بسلام."
      ]
    }
  ];

  let currentStoryIndex = 0;
  let currentPageIndex = 0;
  let currentFontSize = 22;

  let audioCtx = null;
  let isRainActive = false;
  let isThunderActive = false;
  let rainSource = null;
  let rainGainNode = null;
  let thunderInterval = null;
  let sleepTimerTimeout = null;

  function init() {
    renderBooks();
    createFallingSky();
  }

  function renderBooks() {
    const container = document.getElementById('booksContainer');
    container.innerHTML = '';
    stories.forEach((story, idx) => {
      const card = document.createElement('div');
      card.className = 'book-card';
      card.onclick = () => openBook(idx);
      card.innerHTML = `
        <div class="book-emoji">${story.emoji}</div>
        <div class="book-title">${story.title}</div>
      `;
      container.appendChild(card);
    });
  }

  function openBook(index) {
    currentStoryIndex = index;
    currentPageIndex = 0;
    document.getElementById('booksView').style.display = 'none';
    document.getElementById('storyView').style.display = 'block';
    updateUI();
  }

  function showBooksList() {
    document.getElementById('storyView').style.display = 'none';
    document.getElementById('booksView').style.display = 'block';
  }

  function createFallingSky() {
    const sky = document.getElementById('skyContainer');
    const symbols = ['🌙', '⭐', '✨', '💫'];
    for (let i = 0; i < 16; i++) {
      const item = document.createElement('div');
      item.className = 'falling-item';
      item.innerText = symbols[Math.floor(Math.random() * symbols.length)];
      item.style.left = `${Math.random() * 100}%`;
      item.style.fontSize = `${Math.random() * 12 + 12}px`;
      item.style.animationDuration = `${Math.random() * 8 + 6}s`;
      item.style.animationDelay = `${Math.random() * 5}s`;
      sky.appendChild(item);
    }
  }

  function initAudioContext() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function toggleRain() {
    initAudioContext();
    const btn = document.getElementById('rainBtn');

    if (!isRainActive) {
      const bufferSize = audioCtx.sampleRate * 2;
      const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const output = noiseBuffer.getChannelData(0);

      for (let i = 0; i < bufferSize; i++) {
        output[i] = Math.random() * 2 - 1;
      }

      rainSource = audioCtx.createBufferSource();
      rainSource.buffer = noiseBuffer;
      rainSource.loop = true;

      const lowpass = audioCtx.createBiquadFilter();
      lowpass.type = 'lowpass';
      lowpass.frequency.setValueAtTime(450, audioCtx.currentTime);

      rainGainNode = audioCtx.createGain();
      const vol = document.getElementById('rainVol').value;
      rainGainNode.gain.setValueAtTime(vol * 0.1, audioCtx.currentTime);

      rainSource.connect(lowpass);
      lowpass.connect(rainGainNode);
      rainGainNode.connect(audioCtx.destination);

      rainSource.start();
      isRainActive = true;
      btn.innerText = "🌧️ مطر: يعمل";
      btn.classList.add('active');
    } else {
      if (rainSource) rainSource.stop();
      isRainActive = false;
      btn.innerText = "🌧️ مطر: مغلق";
      btn.classList.remove('active');
    }
  }

  function toggleThunder() {
    initAudioContext();
    const btn = document.getElementById('thunderBtn');
    
    if (!isThunderActive) {
      isThunderActive = true;
      btn.innerText = "⚡ برق: يعمل";
      btn.classList.add('active');

      playSoftThunder();
      thunderInterval = setInterval(playSoftThunder, 9000);
    } else {
      isThunderActive = false;
      if (thunderInterval) clearInterval(thunderInterval);
      btn.innerText = "⚡ برق: مغلق";
      btn.classList.remove('active');
    }
  }

  function updateVolume() {
    if (rainGainNode && isRainActive) {
      const vol = document.getElementById('rainVol').value;
      rainGainNode.gain.setValueAtTime(vol * 0.1, audioCtx.currentTime);
    }
  }

  function triggerLightningFlash() {
    const flash = document.getElementById('flash');
    flash.style.opacity = '1';
    setTimeout(() => { flash.style.opacity = '0'; }, 150);
  }

  function playSoftThunder() {
    if (!audioCtx || !isThunderActive) return;

    triggerLightningFlash();

    const now = audioCtx.currentTime;
    const masterVol = document.getElementById('thunderVol').value;

    const osc1 = audioCtx.createOscillator();
    const gain1 = audioCtx.createGain();
    const filter1 = audioCtx.createBiquadFilter();

    osc1.type = 'sine';
    osc1.frequency.setValueAtTime(100, now);
    osc1.frequency.exponentialRampToValueAtTime(30, now + 2.0);

    filter1.type = 'lowpass';
    filter1.frequency.value = 250;

    gain1.gain.setValueAtTime(0.01, now);
    gain1.gain.linearRampToValueAtTime(0.25 * masterVol, now + 0.15);
    gain1.gain.exponentialRampToValueAtTime(0.001, now + 2.0);

    osc1.connect(filter1);
    filter1.connect(gain1);
    gain1.connect(audioCtx.destination);

    osc1.start(now);
    osc1.stop(now + 2.0);

    const bufferSize = audioCtx.sampleRate * 2.5;
    const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const output = noiseBuffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      output[i] = Math.random() * 2 - 1;
    }

    const noise = audioCtx.createBufferSource();
    noise.buffer = noiseBuffer;

    const filter2 = audioCtx.createBiquadFilter();
    filter2.type = 'bandpass';
    filter2.frequency.value = 180;

    const gain2 = audioCtx.createGain();
    gain2.gain.setValueAtTime(0.01, now);
    gain2.gain.linearRampToValueAtTime(0.18 * masterVol, now + 0.2);
    gain2.gain.exponentialRampToValueAtTime(0.001, now + 2.5);

    noise.connect(filter2);
    filter2.connect(gain2);
    gain2.connect(audioCtx.destination);

    noise.start(now);
    noise.stop(now + 2.5);
  }

  function setSleepTimer() {
    if (sleepTimerTimeout) clearTimeout(sleepTimerTimeout);
    const minutes = parseInt(document.getElementById('timerSelect').value);
    
    if (minutes > 0) {
      sleepTimerTimeout = setTimeout(() => {
        if (isRainActive) toggleRain();
        if (isThunderActive) toggleThunder();
        document.getElementById('timerSelect').value = "0";
      }, minutes * 60 * 1000);
    }
  }

  function copyStoryText() {
    const text = document.getElementById('storyText').innerText;
    navigator.clipboard.writeText(text).then(() => {
      alert("تم نسخ الصفحة بنجاح!");
    });
  }

  function changePage(direction) {
    currentPageIndex += direction;
    updateUI();
  }

  function updateUI() {
    const story = stories[currentStoryIndex];
    document.getElementById('storyTitle').innerText = `${story.emoji} ${story.title}`;
    document.getElementById('storyText').innerText = story.pages[currentPageIndex];
    document.getElementById('pageIndicator').innerText = `الصفحة ${currentPageIndex + 1} من ${story.pages.length}`;

    const progress = ((currentPageIndex + 1) / story.pages.length) * 100;
    document.getElementById('progressFill').style.width = `${progress}%`;

    document.getElementById('prevBtn').disabled = (currentPageIndex === 0);
    document.getElementById('nextBtn').disabled = (currentPageIndex === story.pages.length - 1);
  }

  function adjustFont(val) {
    currentFontSize = Math.max(16, Math.min(32, currentFontSize + (val * 2)));
    document.documentElement.style.setProperty('--font-size', `${currentFontSize}px`);
  }

  function toggleSuperDark() {
    document.body.classList.toggle('super-dark');
  }

  window.onload = init;
</script>

</body>
</html>
