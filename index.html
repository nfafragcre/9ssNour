<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مكتبة الهدوء والليالي الماطرة 📖🌙</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #050811;
      --card-bg: rgba(13, 18, 30, 0.95);
      --book-paper: #0b101d;
      --text-color: #e2e8f0;
      --accent-gold: #f59e0b;
      --accent-hover: #d97706;
      --border-color: rgba(245, 158, 11, 0.2);
      --font-size: 20px;
    }

    body.super-dark {
      --bg-color: #000000;
      --card-bg: #080808;
      --book-paper: #030303;
      --text-color: #a1a1aa;
      --accent-gold: #71717a;
      --border-color: #27272a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      direction: rtl;
      transition: background-color 0.4s ease;
      overflow-x: hidden;
      position: relative;
    }

    .lightning-flash {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(255, 255, 255, 0.15);
      pointer-events: none;
      z-index: 999;
      opacity: 0;
      transition: opacity 0.08s ease-out;
    }

    .sky-container {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 0; overflow: hidden;
    }

    .falling-item {
      position: absolute; top: -30px;
      color: var(--accent-gold); opacity: 0.4;
      animation: fall linear infinite; user-select: none;
    }

    @keyframes fall {
      0% { transform: translateY(-30px) rotate(0deg); opacity: 0; }
      20% { opacity: 0.5; }
      80% { opacity: 0.5; }
      100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
    }

    .app-container {
      background: var(--card-bg);
      backdrop-filter: blur(15px);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 30px;
      max-width: 850px;
      width: 100%;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8);
      position: relative;
      z-index: 10;
    }

    .control-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 25px;
      flex-wrap: wrap;
      gap: 15px;
    }

    .audio-controls {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .sound-unit {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 0, 0, 0.3);
      padding: 6px 10px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
    }

    .volume-slider {
      width: 55px;
      accent-color: var(--accent-gold);
      cursor: pointer;
    }

    .btn-action {
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid var(--border-color);
      color: var(--accent-gold);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-action:hover, .btn-action.active {
      background: var(--accent-gold);
      color: #000;
    }

    select.btn-action {
      outline: none;
      background: var(--card-bg);
    }

    .books-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .book-card {
      background: var(--book-paper);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 25px 20px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 12px;
      position: relative;
      overflow: hidden;
    }

    .book-card::before {
      content: '';
      position: absolute;
      right: 0; top: 0; bottom: 0;
      width: 6px;
      background: var(--accent-gold);
      opacity: 0.7;
    }

    .book-card:hover {
      transform: translateY(-6px);
      border-color: var(--accent-gold);
      box-shadow: 0 10px 25px rgba(245, 158, 11, 0.15);
    }

    .book-emoji { font-size: 48px; }
    .book-title { font-size: 17px; font-weight: 700; color: var(--accent-gold); }
    .book-author { font-size: 12px; opacity: 0.6; }

    .reader-view { display: none; }

    .book-frame {
      background: var(--book-paper);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 35px 30px;
      margin: 20px 0;
      min-height: 420px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
    }

    .book-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px dashed var(--border-color);
      padding-bottom: 12px;
      margin-bottom: 20px;
    }

    .book-header-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent-gold);
    }

    .book-content {
      font-family: 'Amiri', serif;
      font-size: var(--font-size);
      line-height: 2.2;
      color: var(--text-color);
      text-align: justify;
      text-align-last: right;
      margin-bottom: 20px;
      transition: font-size 0.2s ease;
    }

    .progress-bar-container {
      height: 4px;
      background: rgba(255,255,255,0.05);
      border-radius: 2px;
      margin-bottom: 12px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--accent-gold);
      width: 0%;
      transition: width 0.3s ease;
    }

    .reader-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      opacity: 0.7;
    }

    .navigation-controls {
      display: flex;
      gap: 12px;
      margin-top: 15px;
    }

    .btn-nav {
      background: rgba(245, 158, 11, 0.15);
      color: var(--accent-gold);
      border: 1px solid var(--accent-gold);
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      flex: 1;
    }

    .btn-nav:hover:not(:disabled) {
      background: var(--accent-gold);
      color: #000;
    }

    .btn-nav:disabled {
      opacity: 0.2;
      cursor: not-allowed;
      border-color: #444;
      color: #444;
    }

    .btn-return {
      background: transparent;
      color: var(--text-color);
      border: 1px solid var(--border-color);
      margin-top: 15px;
      width: 100%;
      padding: 10px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    .btn-return:hover { background: rgba(255,255,255,0.05); }
  </style>
</head>
<body>

  <div class="lightning-flash" id="flash"></div>
  <div class="sky-container" id="skyContainer"></div>

  <div class="app-container">
    
    <div class="control-panel">
      <!-- الأصوات المحيطية الاربعة (الخيار 4) -->
      <div class="audio-controls">
        <div class="sound-unit">
          <button class="btn-action" id="rainBtn" onclick="toggleRain()">🌧️ مطر</button>
          <input type="range" class="volume-slider" id="rainVol" min="0" max="1" step="0.05" value="0.4" oninput="updateVolumes()">
        </div>

        <div class="sound-unit">
          <button class="btn-action" id="thunderBtn" onclick="toggleThunder()">⚡ رعد</button>
          <input type="range" class="volume-slider" id="thunderVol" min="0" max="1" step="0.05" value="0.7" oninput="updateVolumes()">
        </div>

        <div class="sound-unit">
          <button class="btn-action" id="windBtn" onclick="toggleWind()">🍃 رياح</button>
          <input type="range" class="volume-slider" id="windVol" min="0" max="1" step="0.05" value="0.3" oninput="updateVolumes()">
        </div>

        <div class="sound-unit">
          <button class="btn-action" id="fireBtn" onclick="toggleFire()">🪵 موقد</button>
          <input type="range" class="volume-slider" id="fireVol" min="0" max="1" step="0.05" value="0.5" oninput="updateVolumes()">
        </div>
      </div>

      <div class="audio-controls">
        <select class="btn-action" id="timerSelect" onchange="setSleepTimer()">
          <option value="0">⏱️ المؤقت</option>
          <option value="15">15 دقيقة</option>
          <option value="30">30 دقيقة</option>
          <option value="60">60 دقيقة</option>
        </select>

        <button class="btn-action" onclick="toggleSuperDark()">🕶️ داكن</button>
        <button class="btn-action" onclick="adjustFont(1)">A+</button>
        <button class="btn-action" onclick="adjustFont(-1)">A-</button>
      </div>
    </div>

    <div id="booksView">
      <h2 style="color: var(--accent-gold); margin-bottom: 8px; font-weight: 700;">المكتبة الليلية 📚</h2>
      <p style="opacity: 0.6; font-size: 14px; margin-bottom: 20px;">اختر كتاباً للقراءة مع الخيارات الصوتية الأربعة</p>
      <div class="books-grid" id="booksContainer"></div>
    </div>

    <div id="readerView" class="reader-view">
      <div class="progress-bar-container">
        <div class="progress-bar-fill" id="progressFill"></div>
      </div>

      <div class="book-frame">
        <div class="book-header">
          <span class="book-header-title" id="bookTitle">...</span>
          <button class="btn-action" onclick="copyCurrentPage()">📋 نسخ الصفحة</button>
        </div>
        
        <div class="book-content" id="bookContent">...</div>
        
        <div class="reader-footer">
          <span id="authorName">...</span>
          <span id="pageIndicator">الصفحة 0 من 0</span>
        </div>
      </div>

      <div class="navigation-controls">
        <button class="btn-nav" id="prevBtn" onclick="changePage(-1)">➔ الصفحة السابقة</button>
        <button class="btn-nav" id="nextBtn" onclick="changePage(1)">الصفحة التالية ⬅</button>
      </div>

      <button class="btn-return" onclick="showBooksGrid()">العودة لرفوف الكتب 📖</button>
    </div>

  </div>

<script>
  const library = [
    {
      id: 1,
      title: "الأمير الصغير",
      author: "أنطوان دي سانت إكزوبيري",
      emoji: "🦊",
      pages: [
        "طلب مني الأمير الصغير رسم خروف. ولما لم أكن قد رسمت في حياتي سوى ثعبان البوا من الخارج ومن الداخل، أعدت رسم إحدى اللوحتين اللتين كنت أتقنهما: ثعبان البوا المغلق. وصدمت عندما سمعت الفتى الصغير يقول: 'لا! لا! لا أريد فيلاً داخل ثعبان بوا! الثعبان خطير جداً، والفيل ضخم للغاية. بيتي صغير جداً، وأنا بحاجة إلى خروف. ارسم لي خروفاً'. وهكذا قمت برسم الخروف. نظر إليه باهتمام ثم قال: 'لا، هذا مريض جداً. اصنع لي خروفاً آخر'. رسمت خروفاً جديداً، فابتسم صديقي الصغير برقة وتسامح قادماً للقول: 'أنت ترى بنفسك... هذا ليس خروفاً، إنه كبش له قرون...'.",
        "عدت إلى الرسم من جديد، لكنه رفضه كسابقيه: 'هذا كبير السن، وأنا أريد خروفاً يعيش طويلاً'. ولما نفد صبري، وكان عليّ أن أبدأ في تفكيك محرك طائرتي المعطل في الصحراء، خربشت هذا الرسم على السريع، وقلت له: 'هذا هو الصندوق. والخروف الذي تطلبه موجود بالداخل'. وكم كانت مفاجأتي عظيمة عندما رأيت وجه قاضيي الصغير يضيء بابتهاج: 'هذا بالضبط ما كنت أريده! هل تعتقد أن هذا الخروف يحتاج إلى الكثير من العشب؟ لأن بيتي صغير جداً...'. قال ذلك لأنه كان يملك كوكباً لا يتعدى حجمه حجم بيت صغير.",
        "علمت مع الوقت أن كوكبه الأصلي هو الكويكب ب-612. هذا الكويكب لم يرَه بالمناظير سوى فلكي تركي عام 1909، ولم يصدقه أحد آنذاك بسبب زيه. لكن عندما أجبرهم حاكم مستبد على ارتداء الأزياء الأوربية، أعاد الفلكي تقديم إثباته عام 1920 برداء أنيق، فوافق الجميع على اكتشافه. إن الكبار يحبون الأرقام. عندما تحدثهم عن صديق جديد، لا يسألونك أبداً عن الأهم: لا يسألون عن نبرة صوته، أو ألعابه المفضلة، أو إن كان يجمع الفراشات، بل يسألون: كم عمره؟ كم أخاً له؟ كم وزنه؟ وكم يكسب أبوه؟ وحينها فقط يعتقدون أنهم عرفوه."
      ]
    },
    {
      id: 2,
      title: "النبي",
      author: "جبران خليل جبران",
      emoji: "📜",
      pages: [
        "المصطفى، المختار والحبيب، الذي كان فجراً لنهاره الخاص، كان قد انتظر اثنتي عشرة سنة في مدينة أورفاليس مجيء سفينته التي ترجعه إلى الجزيرة التي ولد فيها. وفي السنة الاثنتي عشرة، في اليوم الثاني عشر من أيلول، حصاد الشهر، صعد إلى التل خارج أسوار المدينة وتطلع نحو البحر؛ فرأى سفينته تقبل مع الضباب. حينئذ انفتحت أبواب قلبه، وطارت فرحته بعيداً فوق البحر. وأغمض عينيه وصلى في هدوء روحه. ولكنه وهو نازل من التل، اعتراه حزن، وقال في قلبه: كيف أرحل في سلام ودون ألم؟ لا، لن أخرج من هذه المدينة دون أن تجرح روحي.",
        "ثم قالت له المظلومة: حدثنا عن المحبة. فرفع رأسه ونظر إلى الشعب، وساد الهدوء عليهم. وبصوت عظيم قال: إذا أومأت إليكم المحبة فاتبعوها، وإن كانت مسالكها صعبة ووعرة. وإذا ضمتكم بجناحيها فاستسلموا لها، وإن جرحكم السيف المختفي بين ريشها. وإذا كلمتكم فصدقوها، وإن عبث صوتها بأحلامكم كما تعبث الريح الشمالية بالحديقة. المحبة لا تعطي إلا نفسها، ولا تأخذ إلا من نفسها. المحبة لا تملك، ولا تستملك، لأن المحبة كافية للمحبة."
      ]
    },
    {
      id: 3,
      title: "الشيخ والبحر",
      author: "إرنست همنغواي",
      emoji: "⛵",
      pages: [
        "كان شيخاً يصطاد السمك بمفرده في قارب صغير بـ 'جلف ستريم'، ومضى عليه الآن أربعة وثمانون يوماً دون أن يظفر بسمكة واحدة. وفي الأربعين يوماً الأولى، كان يرافقه صبي. ولكن بعد أربعين يوماً بلا سمك، قال أبوا الصبي لولدهما إن الشيخ أصبح بلا شك 'سالاو'، وهي أتعس صور الحظ السيء، وأمراه بأن يخرج في قارب آخر استطاع أن يصطاد ثلاث سمكات ممتازة في الأسبوع الأول. وكان يحزن الصبي أن يرى الشيخ عائداً كل يوم بقاربه فارغاً، فكان ينزل دائماً لليساعده في حمل حبال الصيد.",
        "كان الشراع مرقعاً بأكياس الطحين الخالية، وكان يبدو كأنه علم هزيمة دائمة. لكن الشيخ كان نحيفاً وضامراً، مع تجاعيد عميقة في مؤخرة عنقه. وكانت البقع البنية لسرطان الجلد الخفيف، الذي تسببه الشمس المنعكسة على البحر الاستوائي، تتناثر على وجنتيه. وكانت يداه تحملان ندوباً عميقة من أثر معالجة الأسماك الثقيلة بالحبال. كل شيء فيه كان قديماً باستثناء عينيه؛ فقد كانتا بالميل نفسه للبحر، ومرحتين ولا تعرفان الهزيمة."
      ]
    }
  ];

  let currentBookIndex = 0;
  let currentPageIndex = 0;
  let currentFontSize = 20;

  let audioCtx = null;
  
  // الحالات ومحركات الصوت
  let isRainActive = false, rainSource = null, rainGain = null;
  let isThunderActive = false, thunderTimeout = null;
  let isWindActive = false, windSource = null, windGain = null;
  let isFireActive = false, fireSource = null, fireGain = null;
  let sleepTimerTimeout = null;

  function init() {
    renderBooksGrid();
    createFallingSky();
  }

  function renderBooksGrid() {
    const container = document.getElementById('booksContainer');
    container.innerHTML = '';
    library.forEach((book, idx) => {
      const card = document.createElement('div');
      card.className = 'book-card';
      card.onclick = () => openBook(idx);
      card.innerHTML = `
        <div class="book-emoji">${book.emoji}</div>
        <div class="book-title">${book.title}</div>
        <div class="book-author">${book.author}</div>
      `;
      container.appendChild(card);
    });
  }

  function openBook(index) {
    currentBookIndex = index;
    currentPageIndex = 0;
    document.getElementById('booksView').style.display = 'none';
    document.getElementById('readerView').style.display = 'block';
    updateReaderUI();
  }

  function showBooksGrid() {
    document.getElementById('readerView').style.display = 'none';
    document.getElementById('booksView').style.display = 'block';
  }

  function updateReaderUI() {
    const book = library[currentBookIndex];
    document.getElementById('bookTitle').innerText = `${book.emoji} ${book.title}`;
    document.getElementById('authorName').innerText = `الكاتب: ${book.author}`;
    document.getElementById('bookContent').innerText = book.pages[currentPageIndex];
    document.getElementById('pageIndicator').innerText = `الصفحة ${currentPageIndex + 1} من ${book.pages.length}`;

    const progress = ((currentPageIndex + 1) / book.pages.length) * 100;
    document.getElementById('progressFill').style.width = `${progress}%`;

    document.getElementById('prevBtn').disabled = (currentPageIndex === 0);
    document.getElementById('nextBtn').disabled = (currentPageIndex === book.pages.length - 1);
  }

  function changePage(direction) {
    currentPageIndex += direction;
    updateReaderUI();
  }

  function createFallingSky() {
    const sky = document.getElementById('skyContainer');
    const symbols = ['🌙', '⭐', '✨', '💫'];
    for (let i = 0; i < 20; i++) {
      const item = document.createElement('div');
      item.className = 'falling-item';
      item.innerText = symbols[Math.floor(Math.random() * symbols.length)];
      item.style.left = `${Math.random() * 100}%`;
      item.style.fontSize = `${Math.random() * 10 + 12}px`;
      item.style.animationDuration = `${Math.random() * 10 + 8}s`;
      item.style.animationDelay = `${Math.random() * 5}s`;
      sky.appendChild(item);
    }
  }

  function initAudioContext() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function createWhiteNoiseBuffer() {
    const bufferSize = audioCtx.sampleRate * 2;
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const output = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      output[i] = Math.random() * 2 - 1;
    }
    return buffer;
  }

  // 1. صوت المطر
  function toggleRain() {
    initAudioContext();
    const btn = document.getElementById('rainBtn');
    if (!isRainActive) {
      rainSource = audioCtx.createBufferSource();
      rainSource.buffer = createWhiteNoiseBuffer();
      rainSource.loop = true;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 500;

      rainGain = audioCtx.createGain();
      const vol = document.getElementById('rainVol').value;
      rainGain.gain.setValueAtTime(vol * 0.1, audioCtx.currentTime);

      rainSource.connect(filter);
      filter.connect(rainGain);
      rainGain.connect(audioCtx.destination);

      rainSource.start();
      isRainActive = true;
      btn.classList.add('active');
    } else {
      if (rainSource) rainSource.stop();
      isRainActive = false;
      btn.classList.remove('active');
    }
  }

  // 2. إصلاح الرعد المطور (سماع الانفجار + الحشرجة)
  function toggleThunder() {
    initAudioContext();
    const btn = document.getElementById('thunderBtn');
    if (!isThunderActive) {
      isThunderActive = true;
      btn.classList.add('active');
      scheduleNextThunder();
    } else {
      isThunderActive = false;
      if (thunderTimeout) clearTimeout(thunderTimeout);
      btn.classList.remove('active');
    }
  }

  function scheduleNextThunder() {
    if (!isThunderActive) return;
    playRealThunder();
    const nextTime = Math.floor(Math.random() * 7000) + 6000; // بين 6 و 13 ثانية
    thunderTimeout = setTimeout(scheduleNextThunder, nextTime);
  }

  function playRealThunder() {
    if (!audioCtx || !isThunderActive) return;

    triggerLightningFlash();

    const now = audioCtx.currentTime;
    const vol = parseFloat(document.getElementById('thunderVol').value);

    // هزة التردد المنخفض
    const osc = audioCtx.createOscillator();
    const oscGain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(120, now);
    osc.frequency.exponentialRampToValueAtTime(30, now + 2.5);

    oscGain.gain.setValueAtTime(0.01, now);
    oscGain.gain.linearRampToValueAtTime(0.6 * vol, now + 0.15);
    oscGain.gain.exponentialRampToValueAtTime(0.001, now + 2.5);

    osc.connect(oscGain);
    oscGain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + 2.5);

    // صوت الحشرجة العالي (Noise)
    const noise = audioCtx.createBufferSource();
    noise.buffer = createWhiteNoiseBuffer();

    const filter = audioCtx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(400, now);
    filter.frequency.linearRampToValueAtTime(100, now + 2.0);

    const noiseGain = audioCtx.createGain();
    noiseGain.gain.setValueAtTime(0.01, now);
    noiseGain.gain.linearRampToValueAtTime(0.4 * vol, now + 0.1);
    noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 2.0);

    noise.connect(filter);
    filter.connect(noiseGain);
    noiseGain.connect(audioCtx.destination);

    noise.start(now);
    noise.stop(now + 2.0);
  }

  // 3. صوت الرياح (خيارات إضافية)
  function toggleWind() {
    initAudioContext();
    const btn = document.getElementById('windBtn');
    if (!isWindActive) {
      windSource = audioCtx.createBufferSource();
      windSource.buffer = createWhiteNoiseBuffer();
      windSource.loop = true;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.value = 300;
      filter.Q.value = 3.0;

      // تحريك التردد لإعطاء إحساس هبوب الرياح
      setInterval(() => {
        if (isWindActive && audioCtx) {
          filter.frequency.setTargetAtTime(200 + Math.random() * 300, audioCtx.currentTime, 1.5);
        }
      }, 2000);

      windGain = audioCtx.createGain();
      const vol = document.getElementById('windVol').value;
      windGain.gain.setValueAtTime(vol * 0.15, audioCtx.currentTime);

      windSource.connect(filter);
      filter.connect(windGain);
      windGain.connect(audioCtx.destination);

      windSource.start();
      isWindActive = true;
      btn.classList.add('active');
    } else {
      if (windSource) windSource.stop();
      isWindActive = false;
      btn.classList.remove('active');
    }
  }

  // 4. صوت الموقد والنار (خيارات إضافية)
  function toggleFire() {
    initAudioContext();
    const btn = document.getElementById('fireBtn');
    if (!isFireActive) {
      fireSource = audioCtx.createBufferSource();
      fireSource.buffer = createWhiteNoiseBuffer();
      fireSource.loop = true;

      const filter = audioCtx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.value = 1000;
      filter.Q.value = 1.0;

      fireGain = audioCtx.createGain();
      const vol = document.getElementById('fireVol').value;
      fireGain.gain.setValueAtTime(vol * 0.05, audioCtx.currentTime);

      fireSource.connect(filter);
      filter.connect(fireGain);
      fireGain.connect(audioCtx.destination);

      fireSource.start();
      isFireActive = true;
      btn.classList.add('active');
    } else {
      if (fireSource) fireSource.stop();
      isFireActive = false;
      btn.classList.remove('active');
    }
  }

  function updateVolumes() {
    if (rainGain && isRainActive) {
      rainGain.gain.setValueAtTime(document.getElementById('rainVol').value * 0.1, audioCtx.currentTime);
    }
    if (windGain && isWindActive) {
      windGain.gain.setValueAtTime(document.getElementById('windVol').value * 0.15, audioCtx.currentTime);
    }
    if (fireGain && isFireActive) {
      fireGain.gain.setValueAtTime(document.getElementById('fireVol').value * 0.05, audioCtx.currentTime);
    }
  }

  function triggerLightningFlash() {
    const flash = document.getElementById('flash');
    flash.style.opacity = '1';
    setTimeout(() => { flash.style.opacity = '0'; }, 120);
  }

  function setSleepTimer() {
    if (sleepTimerTimeout) clearTimeout(sleepTimerTimeout);
    const minutes = parseInt(document.getElementById('timerSelect').value);
    
    if (minutes > 0) {
      sleepTimerTimeout = setTimeout(() => {
        if (isRainActive) toggleRain();
        if (isThunderActive) toggleThunder();
        if (isWindActive) toggleWind();
        if (isFireActive) toggleFire();
        document.getElementById('timerSelect').value = "0";
      }, minutes * 60 * 1000);
    }
  }

  function copyCurrentPage() {
    const text = document.getElementById('bookContent').innerText;
    navigator.clipboard.writeText(text).then(() => {
      alert("تم نسخ الصفحة الحالية لحافظة جهازك.");
    });
  }

  function adjustFont(val) {
    currentFontSize = Math.max(16, Math.min(28, currentFontSize + (val * 2)));
    document.documentElement.style.setProperty('--font-size', `${currentFontSize}px`);
  }

  function toggleSuperDark() {
    document.body.classList.toggle('super-dark');
  }

  window.onload = init;
</script>

</body>
